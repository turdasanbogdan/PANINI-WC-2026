<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panini WC26 — Lipsuri</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d1117; color: #e6edf3;
    font-family: 'Inter', sans-serif;
    min-height: 100vh; padding: 24px 16px 80px;
  }

  header { text-align: center; margin-bottom: 24px; }
  header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2rem, 6vw, 3.5rem);
    letter-spacing: 3px; color: #fff; line-height: 1;
  }
  header h1 span { color: #e8c840; }
  .subtitle { font-size: 13px; color: #8b949e; margin-top: 6px; }

  .stats { display: flex; justify-content: center; gap: 32px; margin-top: 14px; }
  .stat .num { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: #e8c840; line-height: 1; text-align: center; }
  .stat .lbl { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; text-align: center; }

  /* MODE BAR */
  .mode-bar {
    display: flex; justify-content: center; gap: 10px;
    margin: 16px auto 8px; max-width: 600px; flex-wrap: wrap;
  }
  .mode-btn {
    padding: 8px 20px; border-radius: 20px; border: 1px solid #30363d;
    background: #1c2128; color: #8b949e; font-family: 'Inter', sans-serif;
    font-size: 13px; font-weight: 500; cursor: pointer; transition: all .2s;
  }
  .mode-btn:hover { border-color: #e8c840; color: #e8c840; }
  .mode-btn.active { background: #e8c840; border-color: #e8c840; color: #000; font-weight: 600; }
  .mode-btn.copy-btn {
    background: #0d2a1a; border-color: #238636; color: #3fb950;
  }
  .mode-btn.copy-btn:hover { background: #238636; color: #fff; }
  .mode-btn.copy-btn:disabled { opacity: 0.4; cursor: default; background: #0d2a1a; color: #3fb950; }

  .mode-hint { text-align: center; font-size: 12px; color: #8b949e; margin-bottom: 18px; min-height: 18px; }

  .groups {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px; max-width: 1200px; margin: 0 auto;
  }

  .group-block { background: #161b22; border: 1px solid #21262d; border-radius: 10px; overflow: hidden; }
  .group-header {
    background: #1c2128; padding: 8px 14px;
    font-family: 'Bebas Neue', sans-serif; font-size: 13px;
    letter-spacing: 2px; color: #8b949e; border-bottom: 1px solid #21262d;
  }
  .group-header span { color: #e8c840; margin-right: 4px; }

  .team-row {
    display: flex; align-items: flex-start;
    padding: 10px 14px; border-bottom: 1px solid #21262d; gap: 10px;
  }
  .team-row:last-child { border-bottom: none; }

  .team-info { min-width: 80px; }
  .team-name { font-size: 12px; font-weight: 600; color: #e6edf3; }
  .team-abbrev { font-size: 10px; color: #8b949e; margin-top: 1px; }
  .team-count { font-size: 10px; color: #e8c840; margin-top: 2px; }

  .stickers { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; align-content: flex-start; }

  .sticker {
    background: #21262d; border: 1px solid #30363d;
    border-radius: 5px; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: #e6edf3;
    cursor: pointer; user-select: none; position: relative;
    transition: background .15s, border-color .15s, color .15s, transform .1s;
    -webkit-tap-highlight-color: transparent;
  }
  .sticker:hover { background: #2d333b; border-color: #8b949e; }

  /* selected state */
  .sticker.selected {
    background: #0d2149; border-color: #1f6feb; color: #58a6ff;
    transform: scale(1.08);
  }

  /* hold ring (delete mode) */
  .sticker::after {
    content: ''; position: absolute; inset: -2px; border-radius: 7px;
    border: 2px solid transparent;
  }
  .sticker.holding::after {
    border-color: #f85149;
    animation: holdRing .7s linear forwards;
  }
  @keyframes holdRing {
    from { clip-path: inset(0 100% 0 0); }
    to   { clip-path: inset(0 0% 0 0); }
  }
  .sticker.deleting { animation: popOut .2s ease forwards; }
  @keyframes popOut {
    0%   { transform: scale(1); opacity: 1; }
    50%  { transform: scale(1.3); opacity: 0.5; }
    100% { transform: scale(0); opacity: 0; }
  }

  .empty-row { padding: 10px 14px; font-size: 11px; color: #3fb950; font-style: italic; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #238636; color: #fff;
    padding: 10px 22px; border-radius: 20px; font-size: 13px; font-weight: 500;
    opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 999;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 480px) {
    .groups { grid-template-columns: 1fr; }
    .sticker { width: 28px; height: 28px; font-size: 10px; }
  }
</style>
</head>
<body>

<header>
  <h1>Panini <span>WC26</span> Lipsuri</h1>
  <p class="subtitle">Ține apăsat ca să ștergi · Selectează și copiază pentru schimb</p>
  <div class="stats">
    <div class="stat"><div class="num" id="statLeft">—</div><div class="lbl">Rămase</div></div>
    <div class="stat"><div class="num" id="statSelected">0</div><div class="lbl">Selectate</div></div>
    <div class="stat"><div class="num" id="statTotal">—</div><div class="lbl">Total inițial</div></div>
  </div>
</header>

<div class="mode-bar">
  <button class="mode-btn active" id="btnDelete" onclick="setMode('delete')">🗑️ Ștergere</button>
  <button class="mode-btn" id="btnSelect" onclick="setMode('select')">👆 Selectare</button>
  <button class="mode-btn copy-btn" id="btnCopy" onclick="copySelected()" disabled>📋 Copiază lista</button>
</div>
<div class="mode-hint" id="modeHint">Ține apăsat un sticker ca să îl ștergi când l-ai găsit.</div>

<div class="groups" id="groups"></div>
<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = "panini_wc26_lipsuri_v2";

const groups = {
  "A": [
    { name:"Mexico", abbrev:"MEX", needs:[] },
    { name:"South Africa", abbrev:"RSA", needs:[] },
    { name:"South Korea", abbrev:"KOR", needs:[] },
    { name:"Czechia", abbrev:"CZE", needs:[] },
  ],
  "B": [
    { name:"Canada", abbrev:"CAN", needs:[] },
    { name:"Bosnia & Herz.", abbrev:"BIH", needs:[] },
    { name:"Qatar", abbrev:"QAT", needs:[] },
    { name:"Switzerland", abbrev:"SUI", needs:[] },
  ],
  "C": [
    { name:"Brazil", abbrev:"BRA", needs:[] },
    { name:"Morocco", abbrev:"MAR", needs:[] },
    { name:"Haiti", abbrev:"HAI", needs:[] },
    { name:"Scotland", abbrev:"SCO", needs:[] },
  ],
  "D": [
    { name:"USA", abbrev:"USA", needs:[] },
    { name:"Paraguay", abbrev:"PAR", needs:[] },
    { name:"Australia", abbrev:"AUS", needs:[] },
    { name:"Turkey", abbrev:"TUR", needs:[] },
  ],
  "E": [
    { name:"Germany", abbrev:"GER", needs:[] },
    { name:"Curaçao", abbrev:"CUW", needs:[] },
    { name:"Côte d'Ivoire", abbrev:"CIV", needs:[] },
    { name:"Ecuador", abbrev:"ECU", needs:[] },
  ],
  "F": [
    { name:"Netherlands", abbrev:"NED", needs:[] },
    { name:"Japan", abbrev:"JPN", needs:[] },
    { name:"Sweden", abbrev:"SWE", needs:[] },
    { name:"Tunisia", abbrev:"TUN", needs:[] },
  ],
  "G": [
    { name:"Belgium", abbrev:"BEL", needs:[] },
    { name:"Egypt", abbrev:"EGY", needs:[] },
    { name:"Iran", abbrev:"IRN", needs:[] },
    { name:"New Zealand", abbrev:"NZL", needs:[] },
  ],
  "H": [
    { name:"Spain", abbrev:"ESP", needs:[] },
    { name:"Cape Verde", abbrev:"CPV", needs:[] },
    { name:"Saudi Arabia", abbrev:"KSA", needs:[] },
    { name:"Uruguay", abbrev:"URU", needs:[] },
  ],
  "I": [
    { name:"France", abbrev:"FRA", needs:[] },
    { name:"Senegal", abbrev:"SEN", needs:[] },
    { name:"Iraq", abbrev:"IRQ", needs:[] },
    { name:"Norway", abbrev:"NOR", needs:[] },
  ],
  "J": [
    { name:"Argentina", abbrev:"ARG", needs:[] },
    { name:"Algeria", abbrev:"ALG", needs:[] },
    { name:"Austria", abbrev:"AUT", needs:[] },
    { name:"Jordan", abbrev:"JOR", needs:[] },
  ],
  "K": [
    { name:"Portugal", abbrev:"POR", needs:[] },
    { name:"DR Congo", abbrev:"COD", needs:[] },
    { name:"Uzbekistan", abbrev:"UZB", needs:[] },
    { name:"Colombia", abbrev:"COL", needs:[] },
  ],
  "L": [
    { name:"England", abbrev:"ENG", needs:[] },
    { name:"Croatia", abbrev:"CRO", needs:[] },
    { name:"Ghana", abbrev:"GHA", needs:[] },
    { name:"Panama", abbrev:"PAN", needs:[] },
  ],
  "—": [
    { name:"FIFA WC History", abbrev:"FWC", needs:[18] },
  ],
};

const INITIAL_TOTAL = 53;

let mode = 'delete';
let state = {};      // abbrev -> number[]
let selected = {};   // abbrev -> Set of numbers
let holdTimer = null;

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved) { state = saved; return; }
  } catch {}
  for (const teams of Object.values(initialData))
    for (const t of teams)
      state[t.abbrev] = [...t.missing];
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function setMode(m) {
  mode = m;
  document.getElementById('btnDelete').classList.toggle('active', m === 'delete');
  document.getElementById('btnSelect').classList.toggle('active', m === 'select');
  const hints = {
    delete: 'Ține apăsat un sticker ca să îl ștergi când l-ai găsit.',
    select: 'Dă click pe stickere ca să le selectezi. Apoi copiază lista.'
  };
  document.getElementById('modeHint').textContent = hints[m];
  if (m === 'delete') { selected = {}; updateCopyBtn(); }
  render();
}

function updateStats() {
  const left = Object.values(state).reduce((s,a) => s + a.length, 0);
  document.getElementById('statLeft').textContent = left;
  document.getElementById('statTotal').textContent = INITIAL_TOTAL;
}
function updateCopyBtn() {
  const total = Object.values(selected).reduce((s,set) => s + set.size, 0);
  document.getElementById('statSelected').textContent = total;
  document.getElementById('btnCopy').disabled = total === 0;
}
function updateTeamCount(abbrev) {
  const el = document.querySelector(`.team-count[data-abbrev="${abbrev}"]`);
  if (el) {
    const n = (state[abbrev] || []).length;
    el.textContent = n === 0 ? '✓ complet' : `${n} rămase`;
  }
}

// DELETE
function startHold(el, abbrev, num) {
  el.classList.add('holding');
  holdTimer = setTimeout(() => {
    el.classList.remove('holding');
    deleteSticker(abbrev, num, el);
  }, 700);
}
function cancelHold() {
  clearTimeout(holdTimer);
  document.querySelectorAll('.sticker.holding').forEach(e => e.classList.remove('holding'));
}
function deleteSticker(abbrev, num, el) {
  el.classList.add('deleting');
  setTimeout(() => {
    state[abbrev] = (state[abbrev] || []).filter(n => n !== num);
    // also remove from selected if present
    if (selected[abbrev]) selected[abbrev].delete(num);
    saveState();
    updateTeamCount(abbrev);
    updateStats();
    el.remove();
    showToast(`${abbrev} ${num} — găsit! 🎉`);
  }, 200);
}

// SELECT
function toggleSelect(abbrev, num) {
  if (!selected[abbrev]) selected[abbrev] = new Set();
  if (selected[abbrev].has(num)) selected[abbrev].delete(num);
  else selected[abbrev].add(num);
  updateCopyBtn();
  render();
}

function copySelected() {
  const lines = [];
  for (const teams of Object.values(initialData)) {
    for (const team of teams) {
      const set = selected[team.abbrev];
      if (!set || set.size === 0) continue;
      const nums = [...set].sort((a,b) => a-b);
      lines.push(`${team.abbrev}: ${nums.join(', ')}`);
    }
  }
  if (!lines.length) return;
  const text = `Panini WC26 – am nevoie de:\n${lines.join('\n')}`;
  navigator.clipboard.writeText(text).then(() => {
    showToast('✓ Copiat în clipboard!');
    selected = {};
    updateCopyBtn();
    render();
  });
}

function render() {
  const container = document.getElementById('groups');
  container.innerHTML = '';
  updateStats();

  for (const [grp, teams] of Object.entries(groups)) {
    const block = document.createElement('div');
    block.className = 'group-block';
    block.innerHTML = `<div class="group-header"><span>Grupa ${grp}</span></div>`;

    for (const team of teams) {
      const nums = state[team.abbrev] || [];
      if (nums.length === 0) {
        const row = document.createElement('div');
        row.className = 'empty-row';
        row.innerHTML = `<span style="font-weight:600;color:#e6edf3">${team.name}</span> — ✓ complet`;
        block.appendChild(row);
        continue;
      }

      const row = document.createElement('div');
      row.className = 'team-row';
      row.innerHTML = `
        <div class="team-info">
          <div class="team-name">${team.name}</div>
          <div class="team-abbrev">${team.abbrev}</div>
          <div class="team-count" data-abbrev="${team.abbrev}">${nums.length} rămase</div>
        </div>
        <div class="stickers" id="s_${team.abbrev}"></div>`;
      block.appendChild(row);

      const wrap = row.querySelector(`#s_${team.abbrev}`);
      for (const num of nums) {
        const el = document.createElement('div');
        el.className = 'sticker';
        const isSel = mode === 'select' && selected[team.abbrev]?.has(num);
        if (isSel) el.classList.add('selected');

        el.textContent = num;

        if (mode === 'delete') {
          el.title = 'Ține apăsat ca să ștergi';
          el.addEventListener('pointerdown', () => startHold(el, team.abbrev, num));
          el.addEventListener('pointerup',    cancelHold);
          el.addEventListener('pointerleave', cancelHold);
          el.addEventListener('contextmenu',  e => { e.preventDefault(); deleteSticker(team.abbrev, num, el); });
        } else {
          el.title = isSel ? 'Click pentru a deselecta' : 'Click pentru a selecta';
          el.addEventListener('click', () => toggleSelect(team.abbrev, num));
        }

        wrap.appendChild(el);
      }
    }
    container.appendChild(block);
  }
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

loadState();
render();
</script>
</body>
</html>
